name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v0.2.3, or "latest")'
        required: true
        default: 'latest'
        type: string

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        if: inputs.version != 'latest'
        run: |
          if ! gh release view "${{ inputs.version }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.version }} not found in ${{ github.repository }}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Linode
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.LINODE_DEPLOY_PATH }}"
            git pull origin main
            export KAMAJI_VERSION="${{ inputs.version }}"
            docker compose pull kamaji
            docker compose up -d kamaji
            docker compose ps
