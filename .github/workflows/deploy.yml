name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v0.2.3, or "latest")'
        required: true
        default: 'latest'
        type: string

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        if: inputs.version != 'latest'
        run: |
          if ! gh release view "${{ inputs.version }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.version }} not found in ${{ github.repository }}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Linode
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_VERSION: ${{ inputs.version }}
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_VERSION
          script: |
            set -euo pipefail
            cd "${{ secrets.LINODE_DEPLOY_PATH }}"
            git pull origin main
            export KAMAJI_VERSION="$DEPLOY_VERSION"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull kamaji
            docker compose up -d kamaji
            docker compose ps
